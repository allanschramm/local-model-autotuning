name: validate

on:
  push:
  pull_request:

# Same branch pushed + PR-opened = two events; keep only the newest run.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff + pytest
        run: python scripts/run_validate.py
      - name: Standalone Auto tuning E2E without model load
        env:
          TUNING_E2E_DIR: ${{ runner.temp }}/tuning-e2e
        run: python scripts/test_tuning_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuning-evidence
          path: ${{ runner.temp }}/tuning-e2e/
      - name: Tuning distribution and dashboard E2E without model load
        env:
          TMPDIR: ${{ runner.temp }}
        run: python scripts/test_tuning_consumers_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuning-consumer-evidence
          path: |
            ${{ runner.temp }}/tuning-consumers-e2e-*/results.db
            ${{ runner.temp }}/tuning-consumers-e2e-*/verification.json
            ${{ runner.temp }}/tuning-consumers-e2e-*/*.log
      - name: Clean tuning installation E2E without quality dependencies
        env:
          TMPDIR: ${{ runner.temp }}
        run: python scripts/test_tuning_install_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuning-install-evidence
          path: |
            ${{ runner.temp }}/tuning-install-e2e-*/verification.json
            ${{ runner.temp }}/tuning-install-e2e-*/*.log
            ${{ runner.temp }}/tuning-install-e2e-*/tuning/
            ${{ runner.temp }}/tuning-install-e2e-*/consumers/*/results.db
            ${{ runner.temp }}/tuning-install-e2e-*/consumers/*/verification.json
