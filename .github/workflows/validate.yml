name: validate

on:
  push:
  pull_request:

# Same branch pushed + PR-opened = two events; keep only the newest run.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff + pytest
        run: python scripts/run_validate.py
      - name: Standalone Auto tuning E2E without model load
        env:
          TUNING_E2E_DIR: ${{ runner.temp }}/tuning-e2e
        run: python scripts/test_tuning_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuning-evidence
          path: ${{ runner.temp }}/tuning-e2e/
      - name: Legacy consumer compatibility E2E without model load
        env:
          TMPDIR: ${{ runner.temp }}
        run: python scripts/test_legacy_consumers_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-consumer-evidence
          path: |
            ${{ runner.temp }}/legacy-consumers-e2e-*/results.db
            ${{ runner.temp }}/legacy-consumers-e2e-*/verification.json
            ${{ runner.temp }}/legacy-consumers-e2e-*/imports.json
            ${{ runner.temp }}/legacy-consumers-e2e-*/*.log
            ${{ runner.temp }}/legacy-consumers-e2e-*/ranking.txt
            ${{ runner.temp }}/legacy-consumers-e2e-*/dashboard.json

  benchmark-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: benchmark
            script: e2e.mjs
          - suite: claw
            script: claw_e2e.mjs
          - suite: dm
            script: dm_e2e.mjs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: benchmark/package-lock.json
      - name: Install standalone Benchmark
        run: |
          python -m pip install pytest
          npm ci --prefix benchmark --ignore-scripts --no-audit --no-fund
          npm audit --prefix benchmark --omit=dev --audit-level=high
      - name: Install Claw mock service dependencies
        if: matrix.suite == 'claw'
        run: python -m pip install -r benchmark/claw-requirements.txt
      - name: Install BigCodeBench verifier dependencies
        if: matrix.suite == 'benchmark'
        run: python -m pip install -r benchmark/packs/bigcode-hard10/requirements.txt
      - name: Pi Benchmark E2E without model or API spend
        env:
          BENCHMARK_E2E_DIR: ${{ runner.temp }}/pi-benchmark-e2e
          TMPDIR: ${{ runner.temp }}
        run: BENCHMARK_PYTHON="$(command -v python)" node benchmark/test/${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-${{ matrix.suite }}-evidence
          path: |
            ${{ runner.temp }}/pi-${{ matrix.suite }}-e2e*/verification.json
            ${{ runner.temp }}/pi-${{ matrix.suite }}-e2e*/results.db
            ${{ runner.temp }}/pi-${{ matrix.suite }}-e2e*/*.log
            ${{ runner.temp }}/pi-${{ matrix.suite }}-e2e*/benchmark-artifacts/
            ${{ runner.temp }}/pi-${{ matrix.suite }}-e2e*/web-security/
            ${{ runner.temp }}/pi-${{ matrix.suite }}-e2e*/integrity/
