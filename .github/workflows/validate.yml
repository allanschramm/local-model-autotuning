name: validate

on:
  push:
  pull_request:

# Same branch pushed + PR-opened = two events; keep only the newest run.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff + pytest
        run: python scripts/run_validate.py
      - name: Standalone Auto tuning E2E without model load
        env:
          TUNING_E2E_DIR: ${{ runner.temp }}/tuning-e2e
        run: python scripts/test_tuning_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuning-evidence
          path: ${{ runner.temp }}/tuning-e2e/
