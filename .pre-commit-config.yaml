# Git pre-commit for THIS repo only (local-model-autotuning).
# Does NOT install into llama.cpp / claw-eval / parent Nexus-System.
#
# Setup (once, from repo root):
#   uv pip install --python ./venv/Scripts/python.exe -r requirements-dev.txt
#   .\venv\Scripts\pre-commit.exe install
# Manual:
#   .\venv\Scripts\pre-commit.exe run --all-files
#   .\venv\Scripts\python.exe scripts\run_validate.py   # same checks as CI
#
# CI: .github/workflows/validate.yml → scripts/run_validate.py

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
        types_or: [python, pyi]
        files: >-
          (?x)^(
            autoresearch/|
            tests/|
            scripts/[^/]+\.py$|
            ui/
          )
      - id: ruff-format
        types_or: [python, pyi]
        files: >-
          (?x)^(
            autoresearch/|
            tests/|
            scripts/[^/]+\.py$|
            ui/
          )

  - repo: local
    hooks:
      - id: pytest
        name: pytest (owned Python changed)
        entry: python scripts/run_pytest_hook.py
        language: system
        pass_filenames: false
        files: >-
          (?x)^(
            autoresearch/|
            tests/|
            scripts/[^/]+\.py$|
            ui/
          )
        stages: [pre-commit]
