issue: |
  ## Issue — clamp() excludes the advertised maximum

  `clamp(value, lo, hi)` must return `hi` when `value == hi`.
  Today `value == 10` with `hi=10` returns 9.

  Fix `clamp.py` only. Hidden tests cover the inclusive bound.
