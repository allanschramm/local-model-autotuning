issue: |
  ## Issue — retry budget never reaches 1

  `retry.py` exports `N`. Hidden tests require `N == 1`.

  If tests fail with N==0, do **not** decrement N again. Decrementing is the
  bad loop: N goes 0, -1, -2, … and the same edit repeats. Set N to 1 once.
