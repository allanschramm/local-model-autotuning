issue: |
  ## Issue #43 — Dashboard T1a: static asset serving (frozen SWE-lite)

  Foundation slice: the stdlib HTTP server must serve static assets under a
  dedicated static route. No external runtime dependency.

  ### Acceptance
  - GET `/` returns 200 and the HTML has `lang="pt-BR"`.
  - GET `/static/app.css` returns 200 with Content-Type containing `text/css`.
  - Unknown paths return 404.
  - Keep the existing `/` handler working.

  Workspace: `app.py` (server) and `static/app.css` (stylesheet already on disk,
  not served yet).
