[package]
name = "autoresearch-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Native core for ailocal-model-autotuning — fingerprint scrubbing, search state, Pareto compute (PyO3 bindings)."

[lib]
name = "autoresearch_core"
crate-type = ["cdylib", "rlib"]

[features]
default = ["pyo3"]
# `cargo build --no-default-features` produces a pure-Rust build (no PyO3),
# useful for environments without a Python toolchain. Benchmark targets can
# be exercised against this configuration.
pyo3 = []
no-pyo3 = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true
thiserror.workspace = true
tempfile.workspace = true
pyo3.workspace = true

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "fingerprint"
harness = false

[[bench]]
name = "state"
harness = false

[[bench]]
name = "pareto"
harness = false
